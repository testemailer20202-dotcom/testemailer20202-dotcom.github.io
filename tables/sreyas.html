<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');

  :root{
    --page: #0b0d10;
    --board: #15181d;
    --board-edge: #202429;
    --panel: #1b1f26;
    --tile: #1f242c;
    --tile-hi: #262c35;
    --tile-border: rgba(255,255,255,0.07);
    --text: #ece7da;
    --text-dim: #868c96;
    --text-faint: #565c66;
    --amber: #f2a93b;
    --amber-soft: rgba(242,169,59,0.16);
    --green: #34d399;
    --green-soft: rgba(52,211,153,0.16);
    --stem: #55c1f2;
    --commerce: #e8944a;
    --humanities: #b58bf2;
    --languages: #5fd9a0;
    --activity: #f2708a;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, #1a1e24 0%, var(--page) 55%);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    display:flex;
    justify-content:center;
    padding: 32px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ width:100%; max-width: 760px; }

  kbd{
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; font-weight:600;
    color: var(--text-dim); background: var(--panel); border: 1px solid var(--tile-border);
    border-radius: 4px; padding: 1px 5px; line-height:1.5;
  }

  /* ---------- Board shell ---------- */
  .board{
    position:relative;
    background: linear-gradient(180deg, var(--board), #101216);
    border-radius: 18px;
    border: 1px solid var(--board-edge);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    padding: 22px 22px 26px;
  }
  .bolt{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #444a52, #1a1c20);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  .bolt.tl{ top:12px; left:12px; } .bolt.tr{ top:12px; right:12px; }
  .bolt.bl{ bottom:12px; left:12px; } .bolt.br{ bottom:12px; right:12px; }

  /* ---------- Header ---------- */
  .head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 16px; margin-bottom: 18px; padding: 4px 6px 16px;
    border-bottom: 1px solid var(--tile-border);
  }
  .title-row{ display:flex; align-items:center; gap:10px; }
  .title{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 20px;
    letter-spacing: 0.5px; color: var(--text); margin:0;
  }
  .title span{ color: var(--amber); }
  .subtitle{ margin: 4px 0 0; font-size: 13px; color: var(--text-dim); }
  .cmdk-btn{
    display:flex; align-items:center; gap:6px; background: var(--panel); border:1px solid var(--tile-border);
    color: var(--text-dim); font-size:11.5px; font-family:'Manrope',sans-serif; font-weight:600;
    padding: 5px 8px; border-radius:6px; cursor:pointer; transition: all .15s ease;
  }
  .cmdk-btn:hover{ color: var(--text); border-color: var(--amber); }
  .clockbox{ text-align:right; }
  .clock{
    font-family:'JetBrains Mono', monospace; font-size: 22px; font-weight:600;
    color: var(--text); letter-spacing: 1px; font-variant-numeric: tabular-nums;
  }
  .datestr{ font-size: 12px; color: var(--text-dim); margin-top:2px; }

  /* ---------- Status ticker ---------- */
  .ticker{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background: var(--panel); border:1px solid var(--tile-border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 16px; font-size: 13.5px;
  }
  .ticker .badge{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11px;
    padding: 3px 8px; border-radius: 5px; letter-spacing:0.4px;
    background: var(--amber-soft); color: var(--amber); white-space:nowrap;
  }
  .ticker.now .badge{ background: var(--green-soft); color: var(--green); }
  .ticker .msg{ color: var(--text); }
  .ticker .msg b{ color: var(--text); font-weight:700; }
  .jump-today{
    margin-left:auto; background:none; border:1px solid var(--tile-border); color: var(--text-dim);
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:600; padding:6px 10px;
    border-radius:6px; cursor:pointer; transition: all .15s ease; display:flex; align-items:center; gap:6px;
  }
  .jump-today:hover{ color:var(--text); border-color: var(--amber); }

  /* ---------- Controls row ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom: 14px;
  }
  .days{ display:flex; gap:6px; flex:1 1 auto; }
  .day-btn{
    flex:1; font-family:'JetBrains Mono', monospace; font-weight:600; font-size:12.5px;
    background: var(--panel); color: var(--text-dim); border:1px solid var(--tile-border);
    border-radius: 7px; padding: 9px 4px 7px; cursor:pointer; letter-spacing: 0.5px;
    position:relative; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .day-btn:hover{ color: var(--text); }
  .day-btn.active{ background: var(--tile-hi); color: var(--amber); border-color: rgba(242,169,59,0.4); }
  .day-btn .today-mark{
    position:absolute; top:4px; right:6px; width:5px; height:5px; border-radius:50%; background: var(--green);
  }
  .day-btn .num-hint{ position:absolute; top:3px; left:6px; font-size:9px; color: var(--text-faint); }
  .view-toggle-wrap{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .view-toggle{ display:flex; border:1px solid var(--tile-border); border-radius:7px; overflow:hidden; }
  .view-toggle button{
    font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:700; padding: 9px 12px;
    background: var(--panel); color: var(--text-dim); border:none; cursor:pointer;
  }
  .view-toggle button.active{ background: var(--tile-hi); color: var(--text); }

  .filters{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom: 16px;
  }
  .search-wrap{ position:relative; flex:1 1 160px; }
  .search{
    width:100%; background: var(--panel); border:1px solid var(--tile-border); border-radius:7px;
    padding: 8px 32px 8px 10px; color: var(--text); font-family:'Manrope',sans-serif; font-size:13px;
  }
  .search::placeholder{ color: var(--text-faint); }
  .search:focus{ outline:none; border-color: var(--amber); }
  .search-hint{ position:absolute; right:7px; top:50%; transform: translateY(-50%); pointer-events:none; }
  .chip{
    display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    background: var(--panel); border:1px solid var(--tile-border); color: var(--text-dim);
    padding: 6px 10px; border-radius: 999px; cursor:pointer; transition: all .15s ease;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; }
  .chip.active{ color: var(--text); border-color: currentColor; }
  .chip:hover{ color: var(--text); }
  .clear-chip{
    font-size:12px; color: var(--text-faint); background:none; border:none; cursor:pointer;
    text-decoration: underline; padding:4px;
  }

  /* ---------- Day board ---------- */
  .daylabel{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); margin: 4px 2px 8px; letter-spacing:0.5px; }
  .tiles{ display:flex; flex-direction:column; gap:8px; perspective: 1200px; }

  .tile-wrap{ height: 74px; position:relative; }
  .tile-wrap.flipped .flip-inner{ transform: rotateX(180deg); }
  .flip-inner{
    position:relative; width:100%; height:100%; transition: transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .flip-face{
    position:absolute; inset:0; display:flex; align-items:center; gap:14px;
    background: var(--tile); border:1px solid var(--tile-border); border-radius: 9px;
    padding: 0 14px; backface-visibility: hidden; cursor:pointer;
  }
  .flip-face.back{ transform: rotateX(180deg); }

  .tile-wrap.entering{ animation: flapIn .38s ease both; }
  @keyframes flapIn{ from{ transform: rotateX(-90deg); opacity:0; } to{ transform: rotateX(0); opacity:1; } }

  .period-num{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 13px; color: var(--text-faint);
    width: 26px; text-align:center; flex-shrink:0;
  }
  .cat-bar{ width:4px; align-self:stretch; border-radius:3px; flex-shrink:0; }
  .tile-main{ flex:1; min-width:0; }
  .tile-subject{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 16px; letter-spacing: 0.5px;
    color: var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-transform: uppercase;
  }
  .tile-time{ font-size: 11.5px; color: var(--text-dim); margin-top:3px; font-family:'JetBrains Mono', monospace; }
  .tile-now-badge{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:800; color: var(--green);
    background: var(--green-soft); padding: 3px 7px; border-radius: 5px; flex-shrink:0; letter-spacing:0.5px;
  }
  .progress{
    position:absolute; left:0; bottom:0; height:2px; background: var(--green); border-radius: 0 0 0 9px;
    transition: width 1s linear;
  }
  .tile-wrap.current .flip-face.front{ border-color: rgba(52,211,153,0.55); box-shadow: 0 0 0 1px rgba(52,211,153,0.2), 0 0 22px -6px rgba(52,211,153,0.35); }
  .tile-wrap.dimmed .flip-face{ opacity: 0.28; }
  .tile-wrap.kbd-active .flip-face{ outline: 2px solid var(--amber); outline-offset: -2px; }

  .back .tile-main .tile-subject{ font-size: 13px; }
  .back-detail{ font-size: 12px; color: var(--text-dim); line-height:1.5; }
  .back-detail b{ color: var(--text); }

  .break-row{
    display:flex; align-items:center; gap:10px; padding: 2px 14px; color: var(--text-faint);
    font-size: 12px; font-family:'JetBrains Mono', monospace;
  }
  .break-row::before, .break-row::after{ content:""; flex:1; height:1px; background: var(--tile-border); }

  .empty-note{
    text-align:center; color: var(--text-faint); font-size: 13px; padding: 18px 0 4px;
  }

  /* ---------- Week grid ---------- */
  .weekgrid{ border:1px solid var(--tile-border); border-radius: 9px; overflow:hidden; }
  .wg-row{ display:grid; grid-template-columns: 64px repeat(5, 1fr); }
  .wg-row + .wg-row{ border-top: 1px solid var(--tile-border); }
  .wg-cell{
    padding: 9px 6px; font-size: 11px; text-align:center; border-left: 1px solid var(--tile-border);
    cursor:pointer; transition: background .15s ease, opacity .15s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height: 52px;
  }
  .wg-cell:hover{ background: var(--tile-hi); }
  .wg-cell.dimmed{ opacity: 0.25; cursor:default; }
  .wg-cell.dimmed:hover{ background:none; }
  .wg-head{ background: var(--panel); font-family:'JetBrains Mono',monospace; font-weight:700; color: var(--text-dim); cursor:default; }
  .wg-head:hover{ background: var(--panel); }
  .wg-time{ background: var(--panel); font-family:'JetBrains Mono',monospace; color: var(--text-faint); font-size:10px; cursor:default; }
  .wg-time:hover{ background: var(--panel); }
  .wg-subject{ font-family:'JetBrains Mono',monospace; font-weight:700; color: var(--text); text-transform:uppercase; font-size:10.5px; line-height:1.2; }
  .wg-dash{ color: var(--text-faint); }
  .wg-dot{ width:6px; height:6px; border-radius:50%; }

  /* ---------- Footer ---------- */
  .foot{
    display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap: 6px 14px;
    margin-top:18px; padding-top:14px; border-top:1px solid var(--tile-border);
  }
  .foot .item{ display:flex; align-items:center; gap:5px; font-size:11px; color: var(--text-faint); }

  button:focus-visible, input:focus-visible, .flip-face:focus-visible{
    outline: 2px solid var(--amber); outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .tile-wrap.entering{ animation: none; }
    .flip-inner{ transition: none; }
  }

  /* ---------- Command palette ---------- */
  .cmdk-overlay{
    position:fixed; inset:0; background: rgba(6,7,9,0.6); backdrop-filter: blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding-top: 14vh; z-index: 50;
  }
  .cmdk-overlay[hidden]{ display:none; }
  .cmdk-panel{
    width: 92%; max-width: 440px; background: var(--board); border: 1px solid var(--board-edge);
    border-radius: 12px; box-shadow: 0 30px 70px -15px rgba(0,0,0,0.7); overflow:hidden;
  }
  .cmdk-input{
    width:100%; background: var(--panel); border:none; border-bottom: 1px solid var(--tile-border);
    color: var(--text); font-family:'Manrope',sans-serif; font-size:14px; padding: 13px 16px;
  }
  .cmdk-input:focus{ outline:none; }
  .cmdk-list{ max-height: 300px; overflow-y:auto; padding: 6px; }
  .cmdk-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding: 9px 10px; border-radius: 7px; font-size: 13px; color: var(--text-dim); cursor:pointer;
  }
  .cmdk-item.sel{ background: var(--tile-hi); color: var(--text); }
  .cmdk-item .label{ display:flex; align-items:center; gap:8px; }
  .cmdk-empty{ padding: 16px; text-align:center; color: var(--text-faint); font-size: 13px; }

  @media (max-width: 480px){
    .clock{ font-size:18px; }
    .title{ font-size:17px; }
    .tile-subject{ font-size:14px; }
    .wg-row{ grid-template-columns: 46px repeat(5,1fr); }
    .wg-subject{ font-size:9px; }
    .foot .item:nth-child(n+4){ display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="board" id="board">
    <span class="bolt tl"></span><span class="bolt tr"></span><span class="bolt bl"></span><span class="bolt br"></span>

    <div class="head">
      <div>
        <div class="title-row">
          <p class="title">TIME<span>TABLE</span></p>
        </div>
        <p class="subtitle">Weekday schedule, Monday to Friday</p>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
        <button class="cmdk-btn" id="cmdk-open"><kbd>⌘K</kbd> Commands</button>
        <div class="clockbox">
          <div class="clock" id="clock">--:--:--</div>
          <div class="datestr" id="datestr"></div>
        </div>
      </div>
    </div>

    <div class="ticker" id="ticker">
      <span class="badge" id="ticker-badge">-</span>
      <span class="msg" id="ticker-msg">Loading schedule…</span>
      <button class="jump-today" id="jump-today" style="display:none;">Jump to today <kbd>T</kbd></button>
    </div>

    <div class="controls">
      <div class="days" id="day-tabs"></div>
      <div class="view-toggle-wrap">
        <div class="view-toggle">
          <button id="view-day" class="active">Day board</button>
          <button id="view-week">Week grid</button>
        </div>
        <kbd>V</kbd>
      </div>
    </div>

    <div class="filters">
      <div class="search-wrap">
        <input class="search" id="search" type="text" placeholder="Find a subject…">
        <kbd class="search-hint" id="search-hint">/</kbd>
      </div>
      <div id="chips" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      <button class="clear-chip" id="clear-filters" style="display:none;">Clear filters</button>
    </div>

    <div id="daylabel" class="daylabel"></div>
    <div id="day-view"></div>
    <div id="week-view" style="display:none;"></div>

    <div class="foot">
      <span class="item"><kbd>←</kbd><kbd>→</kbd> change day</span>
      <span class="item"><kbd>↑</kbd><kbd>↓</kbd> select class</span>
      <span class="item"><kbd>Enter</kbd> flip</span>
      <span class="item"><kbd>1</kbd>–<kbd>5</kbd> jump to day</span>
      <span class="item"><kbd>⌘K</kbd> commands</span>
    </div>
  </div>
</div>

<div class="cmdk-overlay" id="cmdk-overlay" hidden>
  <div class="cmdk-panel">
    <input class="cmdk-input" id="cmdk-input" type="text" placeholder="Type a command…">
    <div class="cmdk-list" id="cmdk-list"></div>
  </div>
</div>

<script>
(function(){
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

  const PERIOD_TIMES = {
    1: ['07:45','08:45'],
    2: ['08:45','09:45'],
    3: ['10:05','11:05'],
    4: ['11:05','12:05'],
    5: ['12:20','13:20'],
    6: ['13:20','14:20'],
  };

  const RAW = {
    Monday:    ['SST','P.E','Islamic Studies','Math','Physics','CS'],
    Tuesday:   ['Math','Business Studies','Chemistry','Arabic','Environmental Management','Biology'],
    Wednesday: ['Business Studies','Arabic','English','Biology','M.Ed','Environmental Management'],
    Thursday:  ['English','Extra Curricular Activities','Physics','Arabic','CS','Islamic Studies'],
    Friday:    ['Math','Chemistry','English'],
  };

  const CATEGORY = {
    'Math':'stem','Physics':'stem','Chemistry':'stem','CS':'stem','Biology':'stem',
    'Business Studies':'commerce','Chemistry':'stem',
    'Environmental Management':'humanities','SST':'humanities','Islamic Studies':'humanities','M.Ed':'humanities',
    'Arabic':'languages','English':'languages',
    'P.E':'activity','Extra Curricular Activities':'activity',
  };

  const CAT_META = {
    stem:       { label:'Sciences & CS',      color:'var(--stem)' },
    commerce:   { label:'Business & commerce', color:'var(--commerce)' },
    humanities: { label:'Humanities',          color:'var(--humanities)' },
    languages:  { label:'Languages',           color:'var(--languages)' },
    activity:   { label:'Activity',            color:'var(--activity)' },
  };

  const SCHEDULE = {};
  DAYS.forEach(day=>{
    SCHEDULE[day] = RAW[day].map((subject,i)=>{
      const period = i+1;
      const [start,end] = PERIOD_TIMES[period];
      return { period, start, end, subject, category: CATEGORY[subject] };
    });
  });

  const BREAKS = [
    { afterPeriod:2, minutes:20 },
    { afterPeriod:4, minutes:15 },
  ];

  // ---------- state ----------
  const todayName = new Date().toLocaleDateString('en-US',{weekday:'long'});
  const state = {
    selectedDay: DAYS.includes(todayName) ? todayName : 'Monday',
    view: 'day',
    search: '',
    activeCats: new Set(),
    flipped: new Set(),
    focusIndex: 0,
  };

  // ---------- helpers ----------
  function timeToMin(str){ const [h,m] = str.split(':').map(Number); return h*60+m; }
  function nowMin(){ const d=new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
  function fmtMinutes(mins){
    mins = Math.max(0, Math.round(mins));
    const h = Math.floor(mins/60), m = mins%60;
    if(h>0) return h+'h '+m+'m';
    return m+' min';
  }
  function fmtClock(d){
    return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  function nextSchoolDay(fromIndex){
    for(let i=1;i<=7;i++){
      const idx = (fromIndex+i) % 7;
      const name = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][idx];
      if(DAYS.includes(name)) return name;
    }
    return 'Monday';
  }

  function getDayStatus(dayName){
    const periods = SCHEDULE[dayName];
    if(!periods) return { type:'noschool' };
    const cur = nowMin();
    for(const p of periods){
      const s = timeToMin(p.start), e = timeToMin(p.end);
      if(cur>=s && cur<e) return { type:'inclass', period:p, remaining: e-cur, frac: (cur-s)/(e-s) };
    }
    if(cur < timeToMin(periods[0].start)){
      return { type:'beforeschool', next: periods[0], minsUntil: timeToMin(periods[0].start)-cur };
    }
    if(cur >= timeToMin(periods[periods.length-1].end)){
      return { type:'afterschool' };
    }
    for(let i=0;i<periods.length-1;i++){
      const e = timeToMin(periods[i].end), s2 = timeToMin(periods[i+1].start);
      if(cur>=e && cur<s2) return { type:'break', next: periods[i+1], minsUntil: s2-cur };
    }
    return { type:'unknown' };
  }

  // ---------- filter matching ----------
  function matches(subject, category){
    const searchOk = !state.search || subject.toLowerCase().includes(state.search.toLowerCase());
    const catOk = state.activeCats.size === 0 || state.activeCats.has(category);
    return searchOk && catOk;
  }
  function filtersActive(){ return state.search || state.activeCats.size>0; }

  // ---------- day switching (only this path triggers the flip-in animation) ----------
  function switchDay(day){
    if(day === state.selectedDay){ renderAll(); return; }
    state.selectedDay = day;
    state.flipped.clear();
    state.focusIndex = 0;
    renderAll(true);
  }

  // ---------- render: day tabs ----------
  const dayTabsEl = document.getElementById('day-tabs');
  function renderDayTabs(){
    dayTabsEl.innerHTML = '';
    DAYS.forEach((day,i)=>{
      const btn = document.createElement('button');
      btn.className = 'day-btn' + (day===state.selectedDay ? ' active' : '');
      btn.innerHTML = '<span class="num-hint">'+(i+1)+'</span>'+day.slice(0,3);
      if(day===todayName){
        const dot = document.createElement('span');
        dot.className = 'today-mark';
        btn.appendChild(dot);
      }
      btn.addEventListener('click', ()=> switchDay(day));
      dayTabsEl.appendChild(btn);
    });
  }

  // ---------- render: chips ----------
  const chipsEl = document.getElementById('chips');
  function renderChips(){
    chipsEl.innerHTML = '';
    Object.keys(CAT_META).forEach(cat=>{
      const meta = CAT_META[cat];
      const chip = document.createElement('button');
      chip.className = 'chip' + (state.activeCats.has(cat) ? ' active' : '');
      chip.style.color = state.activeCats.has(cat) ? meta.color : '';
      chip.innerHTML = '<span class="dot" style="background:'+meta.color+'"></span>'+meta.label;
      chip.addEventListener('click', ()=>{
        if(state.activeCats.has(cat)) state.activeCats.delete(cat); else state.activeCats.add(cat);
        renderAll();
      });
      chipsEl.appendChild(chip);
    });
  }

  // ---------- render: ticker ----------
  function renderTicker(){
    const ticker = document.getElementById('ticker');
    const badge = document.getElementById('ticker-badge');
    const msg = document.getElementById('ticker-msg');
    const jumpBtn = document.getElementById('jump-today');

    const isToday = state.selectedDay === todayName && DAYS.includes(todayName);
    jumpBtn.style.display = (state.selectedDay !== todayName && DAYS.includes(todayName)) ? 'inline-flex' : 'none';

    if(!DAYS.includes(todayName) && !isToday){
      badge.textContent = 'WEEKEND';
      ticker.classList.remove('now');
      msg.innerHTML = 'It\'s the weekend - showing <b>'+state.selectedDay+'</b>\'s schedule. Back in session '+nextSchoolDay(new Date().getDay())+' at 07:45.';
      return;
    }

    if(!isToday){
      badge.textContent = state.selectedDay.slice(0,3).toUpperCase();
      ticker.classList.remove('now');
      msg.innerHTML = 'Viewing <b>'+state.selectedDay+'</b>\'s schedule.';
      return;
    }

    const status = getDayStatus(state.selectedDay);
    if(status.type === 'inclass'){
      badge.textContent = 'NOW';
      ticker.classList.add('now');
      msg.innerHTML = '<b>'+status.period.subject+'</b> is on - ends in '+fmtMinutes(status.remaining)+'.';
    } else if(status.type === 'break'){
      badge.textContent = 'BREAK';
      ticker.classList.remove('now');
      msg.innerHTML = 'On break - <b>'+status.next.subject+'</b> starts in '+fmtMinutes(status.minsUntil)+'.';
    } else if(status.type === 'beforeschool'){
      badge.textContent = 'SOON';
      ticker.classList.remove('now');
      msg.innerHTML = 'School starts in '+fmtMinutes(status.minsUntil)+' - first up: <b>'+status.next.subject+'</b>.';
    } else if(status.type === 'afterschool'){
      badge.textContent = 'DONE';
      ticker.classList.remove('now');
      const nd = nextSchoolDay(new Date().getDay());
      msg.innerHTML = 'That\'s the school day done. Back '+(nd===state.selectedDay?'tomorrow':nd)+' at 07:45.';
    } else {
      badge.textContent = '-';
      ticker.classList.remove('now');
      msg.textContent = 'No schedule data for this moment.';
    }
  }

  // ---------- render: day board ----------
  const dayViewEl = document.getElementById('day-view');
  const weekViewEl = document.getElementById('week-view');
  const daylabelEl = document.getElementById('daylabel');

  function renderDayBoard(animate){
    const periods = SCHEDULE[state.selectedDay];
    const isToday = state.selectedDay === todayName;
    daylabelEl.textContent = state.selectedDay + ' · ' + periods.length + ' classes';
    if(state.focusIndex > periods.length-1) state.focusIndex = periods.length-1;
    if(state.focusIndex < 0) state.focusIndex = 0;

    const tiles = document.createElement('div');
    tiles.className = 'tiles';

    periods.forEach((p, idx)=>{
      const status = isToday ? getDayStatus(state.selectedDay) : null;
      const isCurrent = status && status.type==='inclass' && status.period.period===p.period;
      const dimmed = filtersActive() && !matches(p.subject, p.category);
      const flipKey = state.selectedDay+'-'+p.period;
      const isFlipped = state.flipped.has(flipKey);
      const isKbdActive = idx === state.focusIndex;

      const w = document.createElement('div');
      w.className = 'tile-wrap'
        + (isCurrent?' current':'')
        + (dimmed?' dimmed':'')
        + (isFlipped?' flipped':'')
        + (isKbdActive?' kbd-active':'')
        + (animate?' entering':'');
      if(animate) w.style.animationDelay = (idx*0.045)+'s';

      const inner = document.createElement('div');
      inner.className = 'flip-inner';

      const front = document.createElement('div');
      front.className = 'flip-face front';
      front.innerHTML =
        '<span class="period-num">P'+p.period+'</span>'+
        '<span class="cat-bar" style="background:'+CAT_META[p.category].color+'"></span>'+
        '<div class="tile-main">'+
          '<div class="tile-subject">'+p.subject+'</div>'+
          '<div class="tile-time">'+p.start+' – '+p.end+'</div>'+
        '</div>'+
        (isCurrent ? '<span class="tile-now-badge">NOW · '+fmtMinutes(status.remaining)+' left</span>' : '');
      if(isCurrent){
        const bar = document.createElement('div');
        bar.className = 'progress';
        bar.style.width = Math.min(100, Math.max(0, status.frac*100))+'%';
        front.appendChild(bar);
      }

      const back = document.createElement('div');
      back.className = 'flip-face back';
      back.innerHTML =
        '<span class="cat-bar" style="background:'+CAT_META[p.category].color+'"></span>'+
        '<div class="tile-main">'+
          '<div class="tile-subject">'+p.subject+'</div>'+
          '<div class="back-detail">Period <b>'+p.period+'</b> of '+periods.length+' · '+(timeToMin(p.end)-timeToMin(p.start))+' minutes · '+CAT_META[p.category].label+'</div>'+
        '</div>';

      function toggleFlip(){
        if(state.flipped.has(flipKey)) state.flipped.delete(flipKey); else state.flipped.add(flipKey);
        state.focusIndex = idx;
        renderDayBoard(false);
      }
      front.addEventListener('click', toggleFlip);
      back.addEventListener('click', toggleFlip);

      inner.appendChild(front);
      inner.appendChild(back);
      w.appendChild(inner);
      tiles.appendChild(w);

      const brk = BREAKS.find(b=>b.afterPeriod===p.period);
      if(brk && idx < periods.length-1){
        const row = document.createElement('div');
        row.className = 'break-row';
        row.textContent = brk.minutes+'-minute break';
        tiles.appendChild(row);
      }
    });

    dayViewEl.innerHTML = '';
    dayViewEl.appendChild(tiles);

    if(periods.length < 6){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = state.selectedDay+'\'s day ends after period '+periods.length+' at '+periods[periods.length-1].end+'.';
      dayViewEl.appendChild(note);
    }
  }

  // ---------- render: week grid ----------
  function renderWeekGrid(){
    const grid = document.createElement('div');
    grid.className = 'weekgrid';

    const header = document.createElement('div');
    header.className = 'wg-row';
    header.innerHTML = '<div class="wg-cell wg-head"></div>' + DAYS.map(d=>'<div class="wg-cell wg-head">'+d.slice(0,3)+'</div>').join('');
    grid.appendChild(header);

    for(let period=1; period<=6; period++){
      const row = document.createElement('div');
      row.className = 'wg-row';
      const [s] = PERIOD_TIMES[period];
      row.innerHTML = '<div class="wg-cell wg-time">P'+period+'<br>'+s+'</div>';

      DAYS.forEach(day=>{
        const entry = SCHEDULE[day].find(p=>p.period===period);
        const cell = document.createElement('div');
        if(entry){
          const dimmed = filtersActive() && !matches(entry.subject, entry.category);
          cell.className = 'wg-cell wg-subject' + (dimmed?' dimmed':'');
          cell.innerHTML = '<span class="wg-dot" style="background:'+CAT_META[entry.category].color+'"></span>'+entry.subject;
          if(!dimmed){
            cell.addEventListener('click', ()=>{
              state.view = 'day';
              document.getElementById('view-day').classList.add('active');
              document.getElementById('view-week').classList.remove('active');
              dayViewEl.style.display='block'; weekViewEl.style.display='none'; daylabelEl.style.display='block';
              state.flipped.add(day+'-'+period);
              state.focusIndex = period-1;
              switchDay(day);
            });
          }
        }else{
          cell.className = 'wg-cell wg-dash';
          cell.textContent = '-';
        }
        row.appendChild(cell);
      });
      grid.appendChild(row);
    }

    weekViewEl.innerHTML = '';
    weekViewEl.appendChild(grid);
  }

  function setView(view, animate){
    state.view = view;
    document.getElementById('view-day').classList.toggle('active', view==='day');
    document.getElementById('view-week').classList.toggle('active', view==='week');
    dayViewEl.style.display = view==='day' ? 'block' : 'none';
    weekViewEl.style.display = view==='week' ? 'block' : 'none';
    daylabelEl.style.display = view==='day' ? 'block' : 'none';
    if(view==='day') renderDayBoard(!!animate); else renderWeekGrid();
  }

  document.getElementById('view-day').addEventListener('click', ()=> setView('day', true));
  document.getElementById('view-week').addEventListener('click', ()=> setView('week'));
  document.getElementById('jump-today').addEventListener('click', ()=> switchDay(todayName));
  document.getElementById('search').addEventListener('input', (e)=>{ state.search = e.target.value; renderAll(); });
  document.getElementById('clear-filters').addEventListener('click', ()=>{
    state.search=''; state.activeCats.clear();
    document.getElementById('search').value='';
    renderAll();
  });

  // ---------- clock ----------
  function tickClock(){
    const d = new Date();
    document.getElementById('clock').textContent = fmtClock(d);
    document.getElementById('datestr').textContent = d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
    renderTicker();
    if(state.view==='day') renderDayBoard(false);
  }

  function renderAll(animateDay){
    renderDayTabs();
    renderChips();
    document.getElementById('clear-filters').style.display = filtersActive() ? 'inline-block' : 'none';
    renderTicker();
    if(state.view==='day') renderDayBoard(!!animateDay); else renderWeekGrid();
  }

  // ---------- command palette ----------
  const cmdkOverlay = document.getElementById('cmdk-overlay');
  const cmdkInput = document.getElementById('cmdk-input');
  const cmdkList = document.getElementById('cmdk-list');
  let cmdkSel = 0;
  let cmdkFiltered = [];

  function buildActions(){
    const actions = [];
    DAYS.forEach((day,i)=>{
      actions.push({ label: 'Go to '+day, hint: String(i+1), run: ()=> switchDay(day) });
    });
    actions.push({ label: 'Switch to week grid', hint:'V', run: ()=> setView('week') });
    actions.push({ label: 'Switch to day board', hint:'V', run: ()=> setView('day', true) });
    if(DAYS.includes(todayName)){
      actions.push({ label: 'Jump to today', hint:'T', run: ()=> switchDay(todayName) });
    }
    if(filtersActive()){
      actions.push({ label: 'Clear filters', hint:'', run: ()=>{
        state.search=''; state.activeCats.clear(); document.getElementById('search').value=''; renderAll();
      }});
    }
    Object.keys(CAT_META).forEach(cat=>{
      const on = state.activeCats.has(cat);
      actions.push({ label: (on?'Remove filter: ':'Filter by ')+CAT_META[cat].label, hint:'', run: ()=>{
        if(on) state.activeCats.delete(cat); else state.activeCats.add(cat);
        renderAll();
      }});
    });
    return actions;
  }

  function renderCmdkList(){
    const q = cmdkInput.value.toLowerCase();
    cmdkFiltered = buildActions().filter(a=> a.label.toLowerCase().includes(q));
    cmdkSel = Math.min(cmdkSel, Math.max(0, cmdkFiltered.length-1));
    cmdkList.innerHTML = '';
    if(cmdkFiltered.length===0){
      const empty = document.createElement('div');
      empty.className = 'cmdk-empty';
      empty.textContent = 'No matching commands.';
      cmdkList.appendChild(empty);
      return;
    }
    cmdkFiltered.forEach((a,i)=>{
      const item = document.createElement('div');
      item.className = 'cmdk-item' + (i===cmdkSel ? ' sel' : '');
      item.innerHTML = '<span class="label">'+a.label+'</span>' + (a.hint ? '<kbd>'+a.hint+'</kbd>' : '');
      item.addEventListener('mousemove', ()=>{ if(cmdkSel!==i){ cmdkSel=i; renderCmdkList(); } });
      item.addEventListener('click', ()=> runSelected());
      cmdkList.appendChild(item);
    });
  }

  function runSelected(){
    const a = cmdkFiltered[cmdkSel];
    closeCmdk();
    if(a) a.run();
  }

  function openCmdk(){
    cmdkOverlay.hidden = false;
    cmdkInput.value = '';
    cmdkSel = 0;
    renderCmdkList();
    setTimeout(()=> cmdkInput.focus(), 0);
  }
  function closeCmdk(){ cmdkOverlay.hidden = true; }

  document.getElementById('cmdk-open').addEventListener('click', openCmdk);
  cmdkOverlay.addEventListener('click', (e)=>{ if(e.target===cmdkOverlay) closeCmdk(); });
  cmdkInput.addEventListener('input', ()=>{ cmdkSel=0; renderCmdkList(); });
  cmdkInput.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); cmdkSel = Math.min(cmdkFiltered.length-1, cmdkSel+1); renderCmdkList(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdkSel = Math.max(0, cmdkSel-1); renderCmdkList(); }
    else if(e.key==='Enter'){ e.preventDefault(); runSelected(); }
    else if(e.key==='Escape'){ e.preventDefault(); closeCmdk(); }
  });

  // ---------- global keyboard-first shortcuts ----------
  document.addEventListener('keydown', (e)=>{
    const inField = e.target.tagName==='INPUT';

    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault();
      if(cmdkOverlay.hidden) openCmdk(); else closeCmdk();
      return;
    }
    if(!cmdkOverlay.hidden) return; // palette handles its own keys while open

    if(inField){
      if(e.key==='Escape'){ e.target.blur(); }
      return;
    }

    const idx = DAYS.indexOf(state.selectedDay);

    if(e.key==='ArrowRight' && idx < DAYS.length-1){ e.preventDefault(); switchDay(DAYS[idx+1]); }
    else if(e.key==='ArrowLeft' && idx > 0){ e.preventDefault(); switchDay(DAYS[idx-1]); }
    else if(e.key==='ArrowDown' && state.view==='day'){
      e.preventDefault();
      const len = SCHEDULE[state.selectedDay].length;
      state.focusIndex = Math.min(len-1, state.focusIndex+1);
      renderDayBoard(false);
    }
    else if(e.key==='ArrowUp' && state.view==='day'){
      e.preventDefault();
      state.focusIndex = Math.max(0, state.focusIndex-1);
      renderDayBoard(false);
    }
    else if((e.key==='Enter' || e.key===' ') && state.view==='day'){
      e.preventDefault();
      const p = SCHEDULE[state.selectedDay][state.focusIndex];
      if(p){
        const flipKey = state.selectedDay+'-'+p.period;
        if(state.flipped.has(flipKey)) state.flipped.delete(flipKey); else state.flipped.add(flipKey);
        renderDayBoard(false);
      }
    }
    else if(/^[1-5]$/.test(e.key)){ e.preventDefault(); switchDay(DAYS[Number(e.key)-1]); }
    else if(e.key.toLowerCase()==='v'){ e.preventDefault(); setView(state.view==='day' ? 'week' : 'day', true); }
    else if(e.key.toLowerCase()==='t' && DAYS.includes(todayName)){ e.preventDefault(); switchDay(todayName); }
    else if(e.key==='/'){ e.preventDefault(); document.getElementById('search').focus(); }
    else if(e.key==='Escape' && filtersActive()){ document.getElementById('clear-filters').click(); }
  });

  renderAll();
  tickClock();
  setInterval(tickClock, 1000);
})();
</script>
</body>
</html>
